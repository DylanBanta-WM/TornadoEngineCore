# Each copy needs its own COMPOSE_PROJECT_NAME and WEB_PORT in .env.
name: ${COMPOSE_PROJECT_NAME:-tornado}

# Modules' own containers (see docker/modules.yml).
include:
  - docker/modules.yml

x-host-user: &host-user "${HOST_UID:-1000}:${HOST_GID:-1000}"

services:
  # Run once on each start: PHP packages and page styles for the website.
  composer:
    image: composer:2.8.12
    user: *host-user
    working_dir: /app
    environment:
      COMPOSER_HOME: /tmp/composer
    command: ["sh", "/tornado/composer.sh"]
    volumes:
      - ./web:/app
      - ./docker/composer.sh:/tornado/composer.sh:ro
      - ./docker/modules.yml:/tornado/modules.yml
      - ./docker/modules.php:/tornado/modules.php:ro

  assets:
    image: node:20.19.5-trixie-slim
    user: *host-user
    working_dir: /app
    environment:
      HOME: /tmp
    command: ["sh", "-c", "[ -d node_modules ] || npm ci --no-audit --no-fund; npm run build"]
    volumes:
      - ./web:/app

  app:
    restart: unless-stopped
    build:
      context: ./docker
      args:
        APP_UID: ${HOST_UID:-1000}
        APP_GID: ${HOST_GID:-1000}
    env_file: .env
    volumes:
      - ./web:/var/www/html
    depends_on:
      migrate:
        condition: service_completed_successfully
      assets:
        condition: service_completed_successfully
    # edge: the website reaches Google (sign-in) over the internet.
    networks: [internal, edge]

  # Run once on each start: database updates from Core and its modules.
  migrate:
    build:
      context: ./docker
      args:
        APP_UID: ${HOST_UID:-1000}
        APP_GID: ${HOST_GID:-1000}
    env_file: .env
    command: ["php", "artisan", "migrate", "--force"]
    volumes:
      - ./web:/var/www/html
    depends_on:
      mariadb:
        condition: service_healthy
      composer:
        condition: service_completed_successfully
    networks: [internal]

  # Nginx WEB: Tornado Engine's own web server (not the district's Nginx RP).
  nginx-web:
    restart: unless-stopped
    image: nginx:1.28.3-alpine3.23
    ports:
      - "${WEB_BIND:-0.0.0.0}:${WEB_PORT:-8090}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web/public:/var/www/html/public:ro
    depends_on: [app]
    networks: [internal, edge, link]

  mariadb:
    restart: unless-stopped
    image: mariadb:11.4.13-noble
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:?set in .env}
      MARIADB_USER: ${DB_USERNAME:?set in .env}
      MARIADB_PASSWORD: ${DB_PASSWORD:?set in .env}
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    volumes:
      - mariadb:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 20
    networks: [internal]

  # The harness: Claude Code, with only this folder and no access to the host.
  harness:
    restart: unless-stopped
    build:
      context: .
      dockerfile: harness/Dockerfile
      args:
        HARNESS_UID: ${HOST_UID:-1000}
        HARNESS_GID: ${HOST_GID:-1000}
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      HARNESS_WEB_URL: http://nginx-web
      HTTPS_PROXY: http://harness-proxy:8888
      HTTP_PROXY: http://harness-proxy:8888
      NO_PROXY: localhost,127.0.0.1,nginx-web
      https_proxy: http://harness-proxy:8888
      http_proxy: http://harness-proxy:8888
      no_proxy: localhost,127.0.0.1,nginx-web
    volumes:
      - type: bind
        source: .
        target: /workspace
      # The website's secrets stay out of the harness.
      - type: bind
        source: /dev/null
        target: /workspace/.env
        read_only: true
      - harness-home:/home/claude
    tmpfs:
      - /tmp
    networks: [harness-internal, link]
    depends_on: [harness-proxy]

  harness-proxy:
    restart: unless-stopped
    build:
      context: .
      dockerfile: harness/proxy/Dockerfile
    environment:
      HARNESS_NETWORK: ${HARNESS_NETWORK:-open}
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /run/tinyproxy:mode=1777
    networks: [harness-internal, harness-egress]

networks:
  internal:
    internal: true
  edge: {}
  # The harness and the website's Nginx only.
  link:
    internal: true
  # No route out: the harness reaches the internet only through the proxy.
  harness-internal:
    internal: true
  harness-egress: {}

volumes:
  mariadb:
  harness-home:
