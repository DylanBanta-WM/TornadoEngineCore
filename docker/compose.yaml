name: tornado

services:
  app:
    build:
      context: .
      args:
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    image: tornado-app:dev
    container_name: tornado-app
    volumes:
      - ../web:/var/www/html
    depends_on:
      mariadb:
        condition: service_healthy
    networks: [internal]

  nginx:
    image: nginx:1.28.3-alpine3.23
    container_name: tornado-nginx
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8090}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../web/public:/var/www/html/public:ro
    depends_on: [app]
    networks: [internal, edge]

  mariadb:
    image: mariadb:11.4.13-noble
    container_name: tornado-mariadb
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:?set in web/.env}
      MARIADB_USER: ${DB_USERNAME:?set in web/.env}
      MARIADB_PASSWORD: ${DB_PASSWORD:?set in web/.env}
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    volumes:
      - mariadb:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 20
    networks: [internal]

networks:
  internal:
    internal: true
  edge: {}

volumes:
  mariadb:
